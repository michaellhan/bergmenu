name: Update menu & deploy

on:
  schedule:
    # 5:00 AM Eastern (09:00 UTC) every day, so the new week is picked up
    # Monday morning and any mid-week menu changes get refreshed too.
    - cron: "0 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrape HUDS
        run: python3 scrape.py
      - name: Commit updated data here
        run: |
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add data/menu.json
          git diff --cached --quiet || git commit -m "Update menu $(date -u +%F)"
          git push
      - name: Publish to michael-han.com/berg
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SITE_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone -q --depth 1 git@github.com:michaellhan/michaellhan.github.io.git site
          rm -rf site/berg && mkdir -p site/berg/data
          cp index.html style.css app.js manifest.webmanifest icon.svg icon-192.png icon-512.png apple-touch-icon.png site/berg/
          cp data/menu.json site/berg/data/
          cd site
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add -A berg
          if git diff --cached --quiet; then echo "Site already up to date."; exit 0; fi
          git commit -q -m "berg: update menu $(date -u +%F)"
          git push -q origin main

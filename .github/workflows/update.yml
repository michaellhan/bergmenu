name: Update menu & deploy

on:
  schedule:
    # 5:00 AM Eastern (09:00 UTC) every day, so the new week is picked up
    # Monday morning and any mid-week menu changes get refreshed too.
    - cron: "0 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://bergmenu.com/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scrape HUDS
        run: python3 scrape.py
      - name: Commit updated data here
        run: |
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add data/menu.json
          git diff --cached --quiet || git commit -m "Update menu $(date -u +%F)"
          git push
      - name: Build site
        run: |
          mkdir -p _site/data
          cp index.html style.css app.js manifest.webmanifest icon.svg icon-192.png icon-512.png apple-touch-icon.png _site/
          cp data/menu.json _site/data/
          echo bergmenu.com > _site/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to bergmenu.com
        uses: actions/deploy-pages@v4

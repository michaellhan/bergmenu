<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Annenberg Menu</title>
  <meta name="description" content="What's new on the Annenberg dining hall menu this week.">
  <meta name="color-scheme" content="light dark">
  <link rel="canonical" href="https://michael-han.com/berg/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Annenberg Menu">
  <meta property="og:description" content="What's new on the Annenberg dining hall menu each day, with the everyday staples filtered out.">
  <meta property="og:url" content="https://michael-han.com/berg/">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafaf9">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131211">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Berg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Annenberg</h1>
      <p class="sub">What's new each day</p>
    </div>
    <nav class="controls" aria-label="View controls">
      <div class="weeknav">
        <button id="prev" class="icon" aria-label="Previous week">&#8249;</button>
        <span id="range" class="range">&nbsp;</span>
        <button id="next" class="icon" aria-label="Next week">&#8250;</button>
      </div>
      <div class="chips" id="meals" role="group" aria-label="Meals">
        <button class="chip" data-meal="Breakfast">Breakfast</button>
        <button class="chip" data-meal="Lunch">Lunch</button>
        <button class="chip" data-meal="Dinner">Dinner</button>
      </div>
      <input type="search" id="q" class="search" placeholder="Search" aria-label="Search the menu" autocomplete="off">
    </nav>
  </header>

  <div class="daytabs" id="daytabs" role="tablist" aria-label="Days"></div>

  <main id="grid" class="grid" aria-live="polite">
    <p class="loading">Loading menu…</p>
  </main>

  <footer class="foot">
    <label class="toggle">
      <input type="checkbox" id="all">
      <span>Show everything</span>
    </label>
    <span id="updated"></span>
    <a id="source" href="https://www.foodpro.huds.harvard.edu/foodpro/shtmenu.aspx?sName=HARVARD+UNIVERSITY+DINING+SERVICES&locationNum=30&locationName=Annenberg&naFlag=1&WeeksMenus=This+Week%27s+Menus&myaction=read" target="_blank" rel="noopener">Full menu on HUDS ↗</a>
  </footer>

  <script src="app.js?v=10"></script>
</body>
</html>
